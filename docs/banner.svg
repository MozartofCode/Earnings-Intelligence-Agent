<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="earnings-desk: an open-source AI research desk for stocks and earnings">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11150f"/>
      <stop offset="1" stop-color="#0b0d0b"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1d241e" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" fill="url(#g)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity=".7"/>
  <!-- price line -->
  <polyline fill="none" stroke="#f08a4b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"
    points="640,270 680,250 715,262 750,220 790,232 830,188 865,198 900,150 940,166 975,120 1015,132 1050,92 1090,104 1130,64"/>
  <circle cx="1130" cy="64" r="7" fill="#f08a4b"/>
  <g fill="#4fc283" opacity=".85">
    <rect x="660" y="290" width="18" height="40"/><rect x="700" y="300" width="18" height="30"/><rect x="740" y="280" width="18" height="50"/>
    <rect x="780" y="285" width="18" height="45"/><rect x="820" y="270" width="18" height="60"/><rect x="860" y="275" width="18" height="55"/>
    <rect x="900" y="258" width="18" height="72"/><rect x="940" y="262" width="18" height="68"/><rect x="980" y="244" width="18" height="86"/>
    <rect x="1020" y="250" width="18" height="80"/><rect x="1060" y="232" width="18" height="98"/><rect x="1100" y="222" width="18" height="108"/>
  </g>
  <text x="70" y="96" font-family="ui-monospace, Menlo, monospace" font-size="18" letter-spacing="4" fill="#7d796d">OPEN-SOURCE · FREE DATA · 20 SKILLS · 8 AGENTS</text>
  <text x="66" y="190" font-family="Georgia, 'Times New Roman', serif" font-size="96" fill="#ece8dc">earnings<tspan fill="#f08a4b">/</tspan>desk</text>
  <text x="70" y="246" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#b9b4a5">An AI research desk for stocks &amp; earnings.</text>
  <text x="70" y="284" font-family="system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="26" fill="#b9b4a5">Skeptical by design. Every number sourced.</text>

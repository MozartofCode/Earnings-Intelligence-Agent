name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate skills, agents and marketplace
        run: ./scripts/validate.sh
      - name: Script smoke tests (help output, no network)
        run: |
          for f in $(find plugins -name "*.py" -path "*/scripts/*"); do
            python3 "$f" --help > /dev/null || { echo "::error file=$f::--help failed"; exit 1; }
          done

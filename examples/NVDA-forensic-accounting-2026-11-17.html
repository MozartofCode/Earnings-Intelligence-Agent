et income (OCF/NI ≥ 1.0) as Blackwell inventory sells through, and DIO returns below ~110 days.", "tone": "pos"}, {"title": "Downgrade to Red", "body": "Inventory keeps outgrowing cost of revenue while revenue growth slows; DSO starts rising; large provision *releases* boost gross margin; or any impairment, restatement or auditor change around the Groq accounting.", "tone": "neg"}], "after": "**Next:** `filing-diff NVDA --section 1A` to see how the export-control and supply language evolved, `insider-ownership` for selling into the numbers, and `capital-allocation` to judge the Groq deal and buybacks."}], "sources": [{"label": "NVIDIA 10-K for FY ended 2026-01-25, filed 2026-02-25 (accn 0001045810-26-000021): MD&A, auditor's report, business combination and commitments notes", "url": "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001045810&type=10-K"}, {"label": "SEC XBRL company facts for scores and multi-year statements (scores.py, statements.py)", "url": "https://data.sec.gov/api/xbrl/companyfacts/CIK0001045810.json"}, {"label": "EDGAR filing index: 62 8-Ks Nov 2020–Nov 2026; no NT, 10-K/A or 10-Q/A filings", "url": "https://www.sec.gov/cgi-bin/browse-edgar?action=getcompany&CIK=0001045810&type=8-K"}, "Price and market cap: Yahoo Finance public chart endpoint via market.py (unofficial, best-effort) × SEC-reported shares outstanding, retrieved 2026-11-17", "Beneish (1999), Altman (1968; Z'' 1995), Piotroski (2000), Sloan (1996) per the skill's forensic playbook"]}</script>
<script>
(function () {
  "use strict";
  var data = JSON.parse(document.getElementById("report-data").textContent);
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]; }); };
  var md = function (s) {
    if (!s) return "";
    var html = window.marked ? marked.parse(String(s)) : "<p>" + esc(s) + "</p>";
    return window.DOMPurify ? DOMPurify.sanitize(html) : html;
  };
  var TONES = ["pos", "neg", "warn", "neutral", "accent"];
  var tone = function (t) { return TONES.indexOf(t) >= 0 ? t : "neutral"; };

  // Theme toggle (remembered per viewer, safe if storage is blocked)
  var root = document.documentElement;
  try { var saved = localStorage.getItem("ed-theme"); if (saved) root.setAttribute("data-theme", saved); } catch (e) {}
  $("theme-btn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") ? root.getAttribute("data-theme") === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("ed-theme", next); } catch (e) {}
    drawCharts();
  });

  // Masthead
  document.title = data.title ? (data.ticker ? data.ticker + " · " : "") + String(data.title).replace(/\*(.+?)\*/g, "$1") : document.title;
  $("tape-skill").textContent = data.skill ? "/" + data.skill : "";
  $("tape-date").textContent = data.date || "";
  $("ticker").textContent = data.ticker || "—";
  $("exchange").textContent = [data.company, data.exchange].filter(Boolean).join(" · ");
  $("title").innerHTML = esc(data.title || "Research report").replace(/\*(.+?)\*/g, "<em>$1</em>");
  $("subtitle").textContent = data.subtitle || "";
  $("meta").innerHTML = (data.meta || []).map(function (m) { return "<span>" + esc(m) + "</span>"; }).join("");
  $("footer-left").textContent = "earnings-desk · " + (data.skill || "report") + (data.date ? " · " + data.date : "");

  if (data.verdict) {
    var v = data.verdict;
    $("stamp").innerHTML = '<div class="stamp tone-' + tone(v.tone) + '"><div class="lbl">' + esc(v.label || "Verdict") + '</div><div class="val">' + esc(v.value) + "</div>" + (v.sub ? '<div class="sub">' + esc(v.sub) + "</div>" : "") + "</div>";
  }

  $("kpis").innerHTML = (data.kpis || []).map(function (k) {
    return '<div class="kpi"><div class="l">' + esc(k.label) + '</div><div class="v">' + esc(k.value) + "</div>" + (k.delta ? '<div class="d tone-' + tone(k.tone) + '">' + esc(k.delta) + "</div>" : "") + "</div>";
  }).join("");
  if (!(data.kpis || []).length) $("kpis").style.display = "none";

  if (data.summary) $("summary").innerHTML = md(data.summary); else $("summary-wrap").style.display = "none";

  // Sections
  var charts = [];
  function renderTable(t) {
    var cols = t.columns || [];
    var numeric = cols.map(function (_, i) { return (t.rows || []).every(function (r) { var c = r[i]; c = (c && typeof c === "object") ? c.text : c; return c == null || c === "" || /^[\s$€£¥+\-–(]*[\d.,]+\s*[%xX)BMKbmk]*\s*(bps)?$/.test(String(c)); }); });
    var head = "<tr>" + cols.map(function (c, i) { return '<th class="' + (numeric[i] ? "num" : "") + '">' + esc(c) + "</th>"; }).join("") + "</tr>";
    var body = (t.rows || []).map(function (r) {
      return "<tr>" + r.map(function (c, i) {
        var cls = numeric[i] ? "num" : "";
        if (c && typeof c === "object") {
          var inner = c.pill ? '<span class="pill ' + tone(c.tone) + '">' + esc(c.text) + "</span>" : '<span class="tone-' + tone(c.tone) + '">' + esc(c.text) + "</span>";
          return '<td class="' + cls + '">' + inner + "</td>";
        }
        return '<td class="' + cls + '">' + esc(c) + "</td>";
      }).join("") + "</tr>";
    }).join("");
    return (t.caption ? '<div class="kicker" style="margin-top:18px">' + esc(t.caption) + "</div>" : "") + '<div class="tablewrap"><table class="data"><thead>' + head + "</thead><tbody>" + body + "</tbody></table></div>";
  }
  function renderScores(list) {
    return list.map(function (s) {
      var pct = Math.max(0, Math.min(100, Number(s.pct) || 0));
      return '<div class="score"><span class="name">' + esc(s.name) + '</span><span class="bar"><i style="width:' + pct + "%;background:var(--" + tone(s.tone) + ', var(--ink-3))"></i></span><span class="num tone-' + tone(s.tone) + '">' + esc(s.value) + "</span></div>";
    }).join("");
  }
  function renderCallouts(list) {
    return '<div class="callouts">' + list.map(function (c) { return '<div class="callout ' + tone(c.tone) + '"><div class="t">' + esc(c.title) + '</div><div class="b">' + md(c.body) + "</div></div>"; }).join("") + "</div>";
  }

  var html = "", toc = "";
  (data.sections || []).forEach(function (s, i) {
    var id = "s" + i;
    toc += '<a href="#' + id + '">' + esc(s.heading) + "</a>";
    html += '<section class="block" id="' + id + '">' + (s.kicker ? '<div class="kicker">' + esc(s.kicker) + "</div>" : "") + "<h2>" + esc(s.heading) + "</h2>";
    if (s.callouts) html += renderCallouts(s.callouts);
    if (s.body) html += '<div class="md">' + md(s.body) + "</div>";
    if (s.scores) html += renderScores(s.scores);
    (s.tables || (s.table ? [s.table] : [])).forEach(function (t) { html += renderTable(t); });
    (s.charts || (s.chart ? [s.chart] : [])).forEach(function (c) { var cid = "c" + charts.length; charts.push({ id: cid, spec: c }); html += '<div class="chart"><canvas id="' + cid + '" aria-label="' + esc(c.title || "chart") + '"></canvas></div>'; });
    if (s.after) html += '<div class="md">' + md(s.after) + "</div>";
    html += "</section>";
  });
  if ((data.sources || []).length) {
    toc += '<a href="#sources">Sources</a>';
    html += '<section class="block sources" id="sources"><div class="kicker">Every number traces back here</div><h2>Sources</h2><ol>' + data.sources.map(function (s) {
      var label = typeof s === "string" ? s : (s.label || s.url);
      var url = typeof s === "string" ? (/^https?:/.test(s) ? s : null) : s.url;
      return "<li>" + (url ? '<a href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label) + "</a>" : esc(label)) + "</li>";
    }).join("") + "</ol></section>";
  }
  $("sections").innerHTML = html;
  $("toc").innerHTML = toc;

  // Highlight the current section in the TOC
  if ("IntersectionObserver" in window) {
    var links = Array.prototype.slice.call(document.querySelectorAll("nav.toc a"));
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { if (e.isIntersecting) links.forEach(function (a) { a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id); }); });
    }, { rootMargin: "-20% 0px -70% 0px" });
    document.querySelectorAll("section.block").forEach(function (s) { io.observe(s); });
  }

  // Charts: spec = {type, title, labels, datasets:[{label, data, type?}], yFormat?: "pct"|"usd"|"x"}
  var live = [];
  function cssVar(n) { return getComputedStyle(root).getPropertyValue(n).trim(); }
  function fmt(v, f) { if (f === "pct") return v + "%"; if (f === "usd") return "$" + v; if (f === "x") return v + "x"; return v; }
  function drawCharts() {
    if (!window.Chart) return;
    live.forEach(function (c) { c.destroy(); }); live = [];
    var palette = ["--chart-1", "--chart-2", "--chart-3", "--chart-4", "--chart-5"].map(cssVar);
    Chart.defaults.font.family = cssVar("--sans");
    Chart.defaults.color = cssVar("--ink-3");
    charts.forEach(function (c) {
      var s = c.spec, type = s.type || "bar";
      var ds = (s.datasets || []).map(function (d, i) {
        var col = palette[i % palette.length];
        return Object.assign({ backgroundColor: (d.type || type) === "line" ? col : col + "cc", borderColor: col, borderWidth: (d.type || type) === "line" ? 2.5 : 0, borderRadius: 3, pointRadius: 2.5, tension: 0.25 }, d);
      });
      live.push(new Chart(document.getElementById(c.id), {
        type: type,
        data: { labels: s.labels || [], datasets: ds },
        options: {
          responsive: true, maintainAspectRatio: false,
          plugins: { title: { display: !!s.title, text: s.title, align: "start", color: cssVar("--ink"), font: { size: 13, weight: "600" } }, legend: { display: ds.length > 1, position: "bottom", labels: { boxWidth: 10, boxHeight: 10 } } },
          scales: type === "pie" || type === "doughnut" ? {} : { x: { grid: { display: false } }, y: { grid: { color: cssVar("--rule") }, ticks: { callback: function (v) { return fmt(v, s.yFormat); } } } }
        }
      }));
    });
  }
  drawCharts();
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", drawCharts);
})();
</script>
</body>
</html>
